name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild/publish (for example v0.1.1)
        required: true
        type: string

env:
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  # ── Internal test suite ─────────────────────────────────────────────────────
  # Runs all tests that live inside this repository.  The emulator starts
  # inside each test fixture on random ports, so no separate emulator process
  # is required.  The dev cert MUST be trusted so that the Azure SDK can open
  # AMQPS connections to localhost.
  internal-tests:
    name: Internal Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # Export the ASP.NET Core dev cert and add it to the system CA bundle so
      # that the Azure SDK's AMQPS client accepts it without any client-side
      # validation override.
      - name: Trust HTTPS dev certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https -ep /tmp/devhttps.pfx -p ""
          openssl pkcs12 -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass: 2>/dev/null \
            || openssl pkcs12 -legacy -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass:
          sudo cp /tmp/devhttps.crt /usr/local/share/ca-certificates/aspnetcore-dev.crt
          sudo update-ca-certificates

      - name: Restore & Build
        run: dotnet build AlmostServiceBus.sln

      - name: Test
        run: |
          dotnet test AlmostServiceBus.sln \
            --no-build \
            --filter "FullyQualifiedName!~RealAsbConformanceTests&FullyQualifiedName!~RealAsbTopicRequeueReproTest" \
            --results-directory artifacts/test-results/internal \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize_trx.py "Internal Tests" artifacts/test-results/internal

      - name: Upload TRX results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: internal-tests-trx
          path: artifacts/test-results/internal
          retention-days: 7

  # ── Wolverine conformance ───────────────────────────────────────────────────
  # Wolverine's own Azure Service Bus tests connect to the official emulator
  # API on port 5673 (AMQP) and 5300 (HTTP management) using
  # UseDevelopmentEmulator=true, which disables TLS.  We start
  # AlmostServiceBus on port 5673 so it becomes a drop-in replacement.
  #
  # Tests run in parallel both within each job (per-class namespace isolation,
  # MaxParallelThreads=4 — see patches/wolverine/parallel-tests.patch)
  # and across CI jobs (matrix strategy splits tests into groups on separate runners).
  wolverine-conformance:
    name: "Wolverine: ${{ matrix.group }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Compliance
            # Compliance fixtures: Inline, Buffered, Topics, TopicsWithCustomRule, Prefixed
            filter_include: "FullyQualifiedName~Compliance"
          - group: End-to-End
            # end_to_end, end_to_end_with_CloudEvents, end_to_end_with_named_broker, using_native_scheduling
            filter_include: "FullyQualifiedName~end_to_end|FullyQualifiedName~using_native_scheduling"
          - group: Routing, Bugs & Unit
            # Everything else: ConventionalRouting, Bugs, StatefulResource, Internal unit tests, etc.
            filter_include: "FullyQualifiedName!~Compliance&FullyQualifiedName!~end_to_end&FullyQualifiedName!~using_native_scheduling"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Checkout Wolverine submodule
        run: git submodule update --init --depth 1 external/wolverine

      - name: Apply submodule patches
        run: pwsh apply-patches.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # The emulator host calls LoadDevCert() at startup, so the cert must
      # exist in the CurrentUser/My store even though Wolverine tests bypass TLS.
      - name: Generate HTTPS dev certificate
        run: dotnet dev-certs https

      - name: Build emulator host
        run: dotnet build src/AlmostServiceBus.Host

      - name: Start emulator on port 5673
        run: |
          # Port 5673: AMQP (matches Wolverine's Servers.AzureServiceBusConnectionString)
          # Port 5300: management HTTP (already bound by default in the host)
          # Port 443:  may fail without root — the host already handles that gracefully
          dotnet run --project src/AlmostServiceBus.Host --no-build \
            -- --Port 5673 --DashboardPort 0 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 30 seconds for the AMQP port to open
          for i in $(seq 1 30); do
            nc -z localhost 5673 2>/dev/null && echo "Emulator ready on port 5673" && break
            sleep 1
          done
          nc -z localhost 5673 || (echo "ERROR: emulator did not start" && exit 1)

      - name: Restore Wolverine Azure Service Bus tests
        run: |
          dotnet restore \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj

      - name: Build Wolverine Azure Service Bus tests
        run: |
          dotnet build \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj \
            --no-restore \
            -f net10.0

      - name: Run Wolverine Azure Service Bus tests
        timeout-minutes: 15
        run: |
          # Global exclusions (apply to all groups)
          FILTER="Category!=Flaky"                                 # Match Wolverine's own CI: skip [Trait("Category", "Flaky")]
          FILTER="$FILTER&FullyQualifiedName!~leader_election"     # Requires PostgreSQL
          FILTER="$FILTER&FullyQualifiedName!~Bug_1933_multi_tenant_conventional_routing"             # Requires second emulator on port 5674
          # Wolverine's tracking compliance tests time out waiting for all activity to complete.
          # Messages flow correctly but Wolverine's internal tracking can't correlate all
          # cascading activity through the emulator within the timeout window.
          FILTER="$FILTER&FullyQualifiedName!~tracking_correlation_id_on_everything"
          # Same tracking-pipeline gap: AsbCascadedTimeout is sent (visible in the activity
          # log) but Wolverine's TrackedSession never observes the cascade as Received
          # within its 30s budget, even though the message reached the queue. Standalone
          # native-scheduling tests (with_inline_endpoint_explicit_scheduling etc.) still
          # run and verify the underlying scheduling behavior.
          FILTER="$FILTER&FullyQualifiedName!~with_inline_endpoint_cascaded_timeout"
          # Request-reply: named broker reply URI resolution
          FILTER="$FILTER&FullyQualifiedName!~correct_scheme_on_reply_uri"
          # NOTE: can_request_reply and can_send_and_wait were previously excluded here
          # because Wolverine's default RemoteInvocationTimeout (5s) times out on slower
          # CI runners before the reply-queue processor picks up the handler's ack.
          # The remote-invocation-timeout.patch raises DefaultRemoteInvocationTimeout to
          # 60s in the Inline / Prefixed / TopicAndSubscriptionWithCustomRule sender
          # fixtures, so both tests now pass in CI and no filter is needed.
          # Inline requeue/DLQ: Wolverine's InlineAzureServiceBusListener._defer completes
          # the AMQP message then re-sends to the retry queue via BatchedSender, but the
          # retry queue never re-delivers.
          FILTER="$FILTER&FullyQualifiedName!~InlineSendingAndReceivingCompliance.will_move_to_dead_letter_queue_without_any_exception_match"
          FILTER="$FILTER&FullyQualifiedName!~InlineSendingAndReceivingCompliance.will_requeue_and_increment_attempts"
          FILTER="$FILTER&FullyQualifiedName!~InlineSendingAndReceivingCompliance.can_apply_requeue_mechanics"
          # Requeue coverage stays enabled, but dlq_mechanics is still flaky when Wolverine
          # opens an ad-hoc receiver against the shared wolverine-dead-letter-queue.
          FILTER="$FILTER&FullyQualifiedName!~dlq_mechanics"
          # Back-pressure: tracking can't detect Message1 received after listener restart
          FILTER="$FILTER&FullyQualifiedName!~can_stop_receiving_when_too_busy_and_restart_listeners"
          # Session ordering: Wolverine's BatchedSender uses parallel serialization
          # (JasperFx.Blocks PushUpstream with ProcessorCount workers) which reorders messages
          # in the outgoing batch before they reach the emulator.  The emulator correctly
          # preserves arrival order, but these tests assume submission order — an inherent
          # mismatch for BufferedInMemory / default-mode senders.  Both tests are in a
          # [Trait("Category", "Flaky")] class for this exact reason.
          FILTER="$FILTER&FullyQualifiedName!~send_and_receive_multiple_messages_to_queue_with_session_identifier"
          FILTER="$FILTER&FullyQualifiedName!~split_messages_with_different_sessionids_into_separate_batches"
          # Group filter: only run tests matching this matrix group
          FILTER="$FILTER&(${{ matrix.filter_include }})"
          dotnet test \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj \
            --no-build \
            -f net10.0 \
            --filter "$FILTER" \
            --results-directory artifacts/test-results/wolverine \
            --logger "console;verbosity=normal" \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: |
          python3 .github/scripts/summarize_trx.py "Wolverine: ${{ matrix.group }}" artifacts/test-results/wolverine

      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true

  # ── NServiceBus tests ───────────────────────────────────────────────────────
  # The NServiceBus.Transport.AzureServiceBus test suite is primarily unit
  # tests that exercise the transport layer using fakes, so no running emulator
  # is required.
  nservicebus-tests:
    name: NServiceBus Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Checkout NServiceBus submodule
        run: git submodule update --init --depth 1 external/NServiceBus.Transport.AzureServiceBus

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build and test NServiceBus transport
        run: |
          dotnet test \
            external/NServiceBus.Transport.AzureServiceBus/src/Tests \
            --results-directory artifacts/test-results/nservicebus \
            --logger "console;verbosity=normal" \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize_trx.py "NServiceBus Tests" artifacts/test-results/nservicebus

  # ── MassTransit conformance ─────────────────────────────────────────────────
  # Runs MassTransit's own Azure Service Bus test suite against the emulator.
  # The submodule is checked out at the upstream commit and a patch is applied
  # to add emulator endpoint support (MT_ASB_ENDPOINT env var) without forking
  # the upstream repo.
  #
  # Known pre-existing failures (emulator limitations, not test infra):
  #   - Sending_a_message_to_a_session  — session-state management link issue
  #   - Publishing_an_encrypted_message_to_an_endpoint — intermittent under load
  masstransit-conformance:
    name: MassTransit Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Checkout MassTransit submodule
        run: git submodule update --init --depth 1 external/MassTransit

      - name: Setup .NET (9 for MassTransit tests, 10 for emulator host)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.x
            10.x

      # Trust the dev cert so the Azure SDK accepts AMQPS connections to localhost.
      - name: Trust HTTPS dev certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https -ep /tmp/devhttps.pfx -p ""
          openssl pkcs12 -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass: 2>/dev/null \
            || openssl pkcs12 -legacy -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass:
          sudo cp /tmp/devhttps.crt /usr/local/share/ca-certificates/aspnetcore-dev.crt
          sudo update-ca-certificates

      - name: Apply submodule patches
        run: pwsh apply-patches.ps1

      - name: Build emulator host
        run: dotnet build src/AlmostServiceBus.Host

      - name: Start emulator on port 5672
        run: |
          dotnet run --project src/AlmostServiceBus.Host --no-build \
            -- --Port 5672 --DashboardPort 0 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z localhost 5672 2>/dev/null && echo "Emulator ready on port 5672" && break
            sleep 1
          done
          nc -z localhost 5672 || (echo "ERROR: emulator did not start" && exit 1)

      - name: Build MassTransit Azure Service Bus tests
        run: |
          dotnet build \
            external/MassTransit/tests/MassTransit.Azure.ServiceBus.Core.Tests \
            -f net9.0

      - name: Run MassTransit Azure Service Bus tests
        env:
          MT_ASB_ENDPOINT: "sb://localhost:5672"
          MT_ASB_KEYNAME: RootManageSharedAccessKey
          MT_ASB_KEYVALUE: emulator
        run: |
          FILTER="FullyQualifiedName!~Sending_a_message_to_a_session"     # Requires session concurrency support
          FILTER="$FILTER&FullyQualifiedName!~Sending_a_message_with"       # MessageData: requires Azure Blob Storage
          FILTER="$FILTER&FullyQualifiedName!~Sending_a_compressed_message_with_data"  # MessageData: requires Azure Blob Storage
          FILTER="$FILTER&FullyQualifiedName!~Sending_multiple_messages_to_a_session"  # Session concurrency
          FILTER="$FILTER&FullyQualifiedName!~Turnout"                    # Turnout/job service, not implemented
          FILTER="$FILTER&TestCategory!=Flaky"                            # NUnit Flaky-marked tests (known intermittent)
          # Saga request-reply with schedule timeout — times out in emulator.
          FILTER="$FILTER&FullyQualifiedName!~Sending_a_request_from_a_state_machine"
          # Session-based saga repository — requires full session concurrency support.
          FILTER="$FILTER&FullyQualifiedName!~Using_a_message_session_as_a_saga_repository"
          # Delayed redelivery via dead-letter queue — not yet supported.
          FILTER="$FILTER&FullyQualifiedName!~Using_delayed_redelivery_with_dead_letter_queue"
          # Complex publish topology — intermittently times out under emulator load.
          FILTER="$FILTER&FullyQualifiedName!~Publish_with_complex_hierarchy"
          # Hardcodes real Azure endpoint, bypasses MT_ASB_ENDPOINT emulator override.
          FILTER="$FILTER&FullyQualifiedName!~Should_not_fail_when_slash_is_missing"
          # Session-based saga container test — requires full session support.
          FILTER="$FILTER&FullyQualifiedName!~Using_the_container_integration"
          # Future/saga with sessions — request-reply times out without session concurrency.
          FILTER="$FILTER&FullyQualifiedName!~FryFuture"
          dotnet test \
            external/MassTransit/tests/MassTransit.Azure.ServiceBus.Core.Tests \
            --no-build \
            -f net9.0 \
            --filter "$FILTER" \
            --results-directory artifacts/test-results/masstransit \
            --logger "console;verbosity=normal" \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize_trx.py "MassTransit Conformance" artifacts/test-results/masstransit


      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true

  pack-and-publish:
    name: Pack & Publish
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs:
      - internal-tests
      - wolverine-conformance
      - nservicebus-tests
      - masstransit-conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0  # MinVer needs full history to derive version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore AlmostServiceBus.sln

      - name: Pack
        run: |
          dotnet pack src/AlmostServiceBus.Core --configuration Release --no-restore --output ./nupkgs
          dotnet pack src/AlmostServiceBus.TestHost --configuration Release --no-restore --output ./nupkgs
          dotnet pack src/AlmostServiceBus.Aspire.Hosting --configuration Release --no-restore --output ./nupkgs
          dotnet pack src/AlmostServiceBus.Host --configuration Release --no-restore --output ./nupkgs

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
