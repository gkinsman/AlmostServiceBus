name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild/publish (for example v0.1.1)
        required: true
        type: string

env:
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  # ── Internal test suite ─────────────────────────────────────────────────────
  # Runs all tests that live inside this repository.  The emulator starts
  # inside each test fixture on random ports, so no separate emulator process
  # is required.  Everything is plaintext (MS-emulator compatibility mode),
  # so no cert setup is needed.
  #
  # One assembly per job (matrix): `dotnet test <solution>` runs every test
  # project in parallel via MSBuild, so on a 2-core runner the emulator-backed
  # assemblies oversubscribe the CPU and throughput/timing-sensitive tests
  # (bulk send, scheduled delivery, lock renewal) intermittently time out.
  # (vstest's runsettings MaxCpuCount does NOT help here — it only caps
  # assembly parallelism within a single vstest invocation, and per-project
  # runs never have more than one.)  Giving each assembly its own runner
  # removes the contention while keeping wall-clock low (jobs run in parallel).
  internal-tests:
    name: "Internal: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit
            slug: unit
            project: tests/AlmostServiceBus.Tests
          - name: Aspire
            slug: aspire
            project: tests/AlmostServiceBus.Aspire.Tests
          - name: SDK Integration
            slug: sdkintegration
            project: tests/AlmostServiceBus.SdkIntegration.Tests
          - name: MassTransit
            slug: masstransit
            project: tests/AlmostServiceBus.MassTransit.Tests
          - name: Conformance
            slug: conformance
            project: tests/AlmostServiceBus.Conformance.Tests
          - name: SDK Live
            slug: sdklive
            project: tests/AlmostServiceBus.SdkLive.Tests
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Restore & Build
        run: dotnet build ${{ matrix.project }}

      - name: Test
        run: |
          dotnet test ${{ matrix.project }} \
            --no-build \
            --filter "FullyQualifiedName!~RealAsbConformanceTests&FullyQualifiedName!~RealAsbTopicRequeueReproTest" \
            --results-directory artifacts/test-results/internal \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: |
          python3 .github/scripts/summarize_trx.py "Internal: ${{ matrix.name }}" artifacts/test-results/internal

      - name: Upload TRX results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: internal-tests-trx-${{ matrix.slug }}
          path: artifacts/test-results/internal
          retention-days: 7

  # ── Client SDK smoke tests ──────────────────────────────────────────────────
  # Runs the official non-.NET Azure Service Bus SDKs (Python, Node.js, Java)
  # against the emulator host — one job per language — through the same
  # end-to-end scenario (see tests/client-sdk-smoke/README.md). This is what
  # backs the README's compatibility claims for those SDKs; the .NET SDK is
  # covered by the internal suites and the framework conformance jobs above.
  client-sdk-smoke:
    name: "Client SDK: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python
            sdk: python
          - name: Node.js
            sdk: node
          - name: Java
            sdk: java
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Build emulator host
        run: dotnet build src/AlmostServiceBus.Host

      # The Java SDK admin client strips the port and always dials HTTPS on 443. Binding 443
      # directly needs privileges the emulator process lacks (setcap can't help: `dotnet run`
      # binds from the unprivileged apphost, not the muxer). So the emulator always listens on
      # 5301 and the Java job adds a loopback NAT redirect 443→5301 — transparent at the TCP
      # layer, so TLS still sees `localhost` (a cert SAN). Python targets 5301 directly; Node
      # uses plain HTTP on 5300.
      - name: Start emulator (AMQP 5672, admin HTTP 5300, admin HTTPS 5301)
        run: |
          dotnet run --project src/AlmostServiceBus.Host --no-build \
            -- --DashboardPort 0 --AdminTlsEnabled true --AdminTlsPort 5301 --AdminTlsCertDir "$RUNNER_TEMP/asb-certs" \
            > emulator.log 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          echo "ASB_CERT_DIR=$RUNNER_TEMP/asb-certs" >> "$GITHUB_ENV"
          if [ "${{ matrix.sdk }}" = "java" ]; then
            sudo iptables -t nat -A OUTPUT -o lo -p tcp --dport 443 -j REDIRECT --to-ports 5301
          fi
          for i in $(seq 1 30); do
            nc -z localhost 5672 2>/dev/null && nc -z localhost 5300 2>/dev/null \
              && nc -z localhost 5301 2>/dev/null \
              && echo "Emulator ready" && break
            sleep 1
          done
          nc -z localhost 5672 || (echo "ERROR: emulator did not start" && cat emulator.log && exit 1)

      # ── Python ──
      - name: Setup Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: tests/client-sdk-smoke/python/requirements.txt

      - name: Run Python SDK smoke test
        if: matrix.sdk == 'python'
        timeout-minutes: 5
        working-directory: tests/client-sdk-smoke/python
        run: |
          pip install -q -r requirements.txt
          python smoke.py

      # Exercises the SDK's ServiceBusAdministrationClient against the HTTPS admin endpoint
      # (5301), trusting the emitted CA via REQUESTS_CA_BUNDLE (the requests transport honours it).
      - name: Run Python SDK admin test (HTTPS)
        if: matrix.sdk == 'python'
        timeout-minutes: 5
        working-directory: tests/client-sdk-smoke/python
        env:
          REQUESTS_CA_BUNDLE: ${{ env.ASB_CERT_DIR }}/emulator-ca.crt
          ASB_ADMIN_CONNECTION_STRING: Endpoint=sb://localhost:5301;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=emulator;UseDevelopmentEmulator=true
        run: python admin.py

      # ── Node.js ──
      - name: Setup Node.js
        if: matrix.sdk == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/client-sdk-smoke/node/package-lock.json

      - name: Run Node.js SDK smoke test
        if: matrix.sdk == 'node'
        timeout-minutes: 5
        working-directory: tests/client-sdk-smoke/node
        run: |
          npm ci --no-audit --no-fund
          node smoke.mjs

      # Exercises the SDK's ServiceBusAdministrationClient against the plain-HTTP admin endpoint
      # (5300). Since @azure/service-bus 7.10.0 the Node admin client honours
      # UseDevelopmentEmulator=true and drops TLS, the same as .NET — so no CA is needed.
      - name: Run Node.js SDK admin test (HTTP)
        if: matrix.sdk == 'node'
        timeout-minutes: 5
        working-directory: tests/client-sdk-smoke/node
        env:
          ASB_ADMIN_CONNECTION_STRING: Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=emulator;UseDevelopmentEmulator=true
        run: node admin.mjs

      # Regression guard for the coalesced sasl-outcome + AMQP header hang (rhea parks the
      # rest of the chunk; see TcpMultiplexer.ProxyAmqpBidirectional). Opens 6 connections at
      # once; hangs to its 30 s deadline without the proxy fix, finishes in ~1 s with it.
      - name: Run Node.js concurrent-connection test
        if: matrix.sdk == 'node'
        timeout-minutes: 5
        working-directory: tests/client-sdk-smoke/node
        run: node concurrent-connections.mjs

      # ── Java ──
      - name: Setup Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.13+9.0.LTS"
          cache: maven
          cache-dependency-path: tests/client-sdk-smoke/java/pom.xml

      - name: Run Java SDK smoke test
        if: matrix.sdk == 'java'
        timeout-minutes: 8
        working-directory: tests/client-sdk-smoke/java
        run: mvn -q -B compile exec:java

      # The Java SDK admin client dials HTTPS on 443, so it runs against the emulator's TLS admin
      # endpoint on 443 with a portless connection string, trusting the CA via a PKCS12 truststore
      # built from the emitted CA. Data-plane usage still goes through the SDK (5672).
      - name: Run Java SDK admin test (HTTPS)
        if: matrix.sdk == 'java'
        timeout-minutes: 8
        working-directory: tests/client-sdk-smoke/java
        env:
          ASB_ADMIN_CONNECTION_STRING: Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=emulator;UseDevelopmentEmulator=true
        run: |
          keytool -importcert -noprompt -alias asb-ca \
            -file "$ASB_CERT_DIR/emulator-ca.crt" \
            -keystore "$ASB_CERT_DIR/emulator-truststore.p12" \
            -storetype PKCS12 -storepass changeit
          MAVEN_OPTS="-Djavax.net.ssl.trustStore=$ASB_CERT_DIR/emulator-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit" \
            mvn -q -B -o exec:java -Dexec.mainClass=io.almostservicebus.smoke.AdminSmoke

      - name: Emulator log on failure
        if: failure()
        run: tail -n 200 emulator.log

      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true

  # ── Wolverine conformance ───────────────────────────────────────────────────
  # Wolverine's own Azure Service Bus tests connect to the official emulator
  # API on port 5673 (AMQP) and 5300 (HTTP management) using
  # UseDevelopmentEmulator=true (plain AMQP + plain HTTP).  We start
  # AlmostServiceBus on port 5673 so it becomes a drop-in replacement.
  #
  # Tests run in parallel both within each job (per-class namespace isolation,
  # MaxParallelThreads=4 — see patches/wolverine/parallel-tests.patch)
  # and across CI jobs (matrix strategy splits tests into groups on separate runners).
  wolverine-conformance:
    name: "Wolverine: ${{ matrix.group }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Compliance
            # Compliance fixtures: Inline, Buffered, Topics, TopicsWithCustomRule, Prefixed
            filter_include: "FullyQualifiedName~Compliance"
          - group: End-to-End
            # end_to_end, end_to_end_with_CloudEvents, end_to_end_with_named_broker, using_native_scheduling
            filter_include: "FullyQualifiedName~end_to_end|FullyQualifiedName~using_native_scheduling"
          - group: Routing, Bugs & Unit
            # Everything else: ConventionalRouting, Bugs, StatefulResource, Internal unit tests, etc.
            filter_include: "FullyQualifiedName!~Compliance&FullyQualifiedName!~end_to_end&FullyQualifiedName!~using_native_scheduling"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Checkout Wolverine submodule
        run: git submodule update --init --depth 1 external/wolverine

      - name: Apply submodule patches
        run: pwsh apply-patches.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Build emulator host
        run: dotnet build src/AlmostServiceBus.Host

      - name: Start emulator on port 5673
        run: |
          # Port 5673: plain AMQP (matches Wolverine's Servers.AzureServiceBusConnectionString)
          # Port 5300: plain admin HTTP (already bound by default in the host)
          dotnet run --project src/AlmostServiceBus.Host --no-build \
            -- --Port 5673 --DashboardPort 0 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 30 seconds for the AMQP port to open
          for i in $(seq 1 30); do
            nc -z localhost 5673 2>/dev/null && echo "Emulator ready on port 5673" && break
            sleep 1
          done
          nc -z localhost 5673 || (echo "ERROR: emulator did not start" && exit 1)

      - name: Restore Wolverine Azure Service Bus tests
        run: |
          dotnet restore \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj

      - name: Build Wolverine Azure Service Bus tests
        run: |
          dotnet build \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj \
            --no-restore \
            -f net10.0

      - name: Run Wolverine Azure Service Bus tests
        timeout-minutes: 15
        run: |
          # Global exclusions (apply to all groups)
          FILTER="Category!=Flaky"                                 # Match Wolverine's own CI: skip [Trait("Category", "Flaky")]
          FILTER="$FILTER&FullyQualifiedName!~leader_election"     # Requires PostgreSQL
          FILTER="$FILTER&FullyQualifiedName!~Bug_1933_multi_tenant_conventional_routing"             # Requires second emulator on port 5674
          # NOTE: can_request_reply and can_send_and_wait were previously excluded here
          # because Wolverine's default RemoteInvocationTimeout (5s) times out on slower
          # CI runners before the reply-queue processor picks up the handler's ack.
          # The remote-invocation-timeout.patch raises DefaultRemoteInvocationTimeout to
          # 60s in the Inline / Prefixed / TopicAndSubscriptionWithCustomRule sender
          # fixtures, so both tests now pass in CI and no filter is needed.
          # NOTE: tracking_correlation_id_on_everything, with_inline_endpoint_cascaded_timeout,
          # will_move_to_dead_letter_queue_without_any_exception_match, the Inline
          # will_requeue_and_increment_attempts / can_apply_requeue_mechanics and
          # can_stop_receiving_when_too_busy_and_restart_listeners used to be excluded for
          # tracking, requeue and back-pressure timeouts. They pass against the emulator now
          # (6/6 targeted runs, 2/2 full-suite runs), so they run again.
          # BufferedSendingAndReceivingCompliance (which holds dlq_mechanics) stays excluded by
          # Category!=Flaky: in 5 targeted runs, two each failed one different test
          # (send_green_that_gets_received_as_blue, will_requeue_and_increment_attempts).
          # Session ordering: Wolverine's BatchedSender uses parallel serialization
          # (JasperFx.Blocks PushUpstream with ProcessorCount workers) which reorders messages
          # in the outgoing batch before they reach the emulator.  The emulator correctly
          # preserves arrival order, but these tests assume submission order — an inherent
          # mismatch for BufferedInMemory / default-mode senders.  Both tests are in a
          # [Trait("Category", "Flaky")] class for this exact reason.
          FILTER="$FILTER&FullyQualifiedName!~send_and_receive_multiple_messages_to_queue_with_session_identifier"
          FILTER="$FILTER&FullyQualifiedName!~split_messages_with_different_sessionids_into_separate_batches"
          # Group filter: only run tests matching this matrix group
          FILTER="$FILTER&(${{ matrix.filter_include }})"
          dotnet test \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj \
            --no-build \
            -f net10.0 \
            --filter "$FILTER" \
            --results-directory artifacts/test-results/wolverine \
            --logger "console;verbosity=normal" \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: |
          python3 .github/scripts/summarize_trx.py "Wolverine: ${{ matrix.group }}" artifacts/test-results/wolverine

      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true

  # ── NServiceBus tests ───────────────────────────────────────────────────────
  # The NServiceBus.Transport.AzureServiceBus test suite is primarily unit
  # tests that exercise the transport layer using fakes, so no running emulator
  # is required.
  nservicebus-tests:
    name: NServiceBus Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Checkout NServiceBus submodule
        run: git submodule update --init --depth 1 external/NServiceBus.Transport.AzureServiceBus

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Build and test NServiceBus transport
        # The NServiceBus transport submodule sets TreatWarningsAsErrors=true in
        # Release, plus NuGetAuditMode=all and NuGetAuditLevel=low, so every low-
        # severity advisory against a transitive dep fails the build. We can't
        # bump the pinned transitives from here (they're pulled via NServiceBus
        # 10.1.0), and the vulns don't affect our emulator runtime, so exempt
        # NU1901 (low-severity audit warnings) from error promotion. Any
        # higher-severity audit warnings (NU1902-NU1904) still fail the build.
        run: |
          dotnet test \
            external/NServiceBus.Transport.AzureServiceBus/src/Tests \
            -p:WarningsNotAsErrors=NU1901 \
            --results-directory artifacts/test-results/nservicebus \
            --logger "console;verbosity=normal" \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize_trx.py "NServiceBus Tests" artifacts/test-results/nservicebus

  # ── NServiceBus emulator acceptance tests ───────────────────────────────────
  # Runs the transport's Emulator.AcceptanceTests (send, batched send, publish)
  # against the emulator, the same way Particular's CI runs them against
  # Microsoft's emulator (Particular/setup-azureservicebus-action, which starts
  # it with no pre-declared entities). Endpoints run installers, so queues,
  # topics and subscriptions are created through the admin API. The transport
  # hard-codes the emulator admin port to 5300 for any UseDevelopmentEmulator
  # connection string (AzureServiceBusTransport.InjectEmulatorAdminPort), so the
  # emulator must own both 5672 and 5300 — admin on another port silently
  # creates the topology somewhere else.
  nservicebus-emulator-acceptance:
    name: NServiceBus Emulator Acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Checkout NServiceBus submodule
        run: git submodule update --init --depth 1 external/NServiceBus.Transport.AzureServiceBus

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Build emulator host
        run: dotnet build src/AlmostServiceBus.Host

      - name: Start emulator (AMQP 5672, admin HTTP 5300)
        run: |
          dotnet run --project src/AlmostServiceBus.Host --no-build             -- --Port 5672 --DashboardPort 0 > emulator.log 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z localhost 5672 2>/dev/null && nc -z localhost 5300 2>/dev/null               && echo "Emulator ready" && break
            sleep 1
          done
          nc -z localhost 5672 && nc -z localhost 5300             || (echo "ERROR: emulator did not start" && cat emulator.log && exit 1)

      - name: Build NServiceBus emulator acceptance tests
        # NU1901: see the NServiceBus Tests job.
        run: |
          dotnet build             external/NServiceBus.Transport.AzureServiceBus/src/Emulator.AcceptanceTests             -p:WarningsNotAsErrors=NU1901

      - name: Run NServiceBus emulator acceptance tests
        env:
          # Without this the tests are ignored (RunOnlyWithEmulatorAttribute) and the job passes vacuously.
          AzureServiceBus_Emulator_ConnectionString: "Endpoint=sb://localhost:5672;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=emulator;UseDevelopmentEmulator=true"
        run: |
          dotnet test             external/NServiceBus.Transport.AzureServiceBus/src/Emulator.AcceptanceTests             --no-build             --results-directory artifacts/test-results/nservicebus-emulator             --logger "console;verbosity=normal"             --logger "trx"

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize_trx.py "NServiceBus Emulator Acceptance" artifacts/test-results/nservicebus-emulator

      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true

  # ── MassTransit conformance ─────────────────────────────────────────────────
  # Runs MassTransit's own Azure Service Bus test suite against the emulator.
  # The submodule is checked out at the upstream commit and a patch is applied
  # to add emulator endpoint support (MT_ASB_ENDPOINT env var) without forking
  # the upstream repo.
  #
  # Each remaining exclusion is listed with its reason in the test step's filter below.
  masstransit-conformance:
    name: MassTransit Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: false

      - name: Checkout MassTransit submodule
        run: git submodule update --init --depth 1 external/MassTransit

      - name: Setup .NET (9 for MassTransit tests, 10 for emulator host)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Apply submodule patches
        run: pwsh apply-patches.ps1

      - name: Build emulator host
        run: dotnet build src/AlmostServiceBus.Host

      - name: Start emulator on port 5672
        run: |
          dotnet run --project src/AlmostServiceBus.Host --no-build \
            -- --Port 5672 --DashboardPort 0 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z localhost 5672 2>/dev/null && echo "Emulator ready on port 5672" && break
            sleep 1
          done
          nc -z localhost 5672 || (echo "ERROR: emulator did not start" && exit 1)

      - name: Build MassTransit Azure Service Bus tests
        run: |
          dotnet build \
            external/MassTransit/tests/MassTransit.Azure.ServiceBus.Core.Tests \
            -f net9.0

      - name: Run MassTransit Azure Service Bus tests
        env:
          MT_ASB_ENDPOINT: "sb://localhost:5672"
          MT_ASB_KEYNAME: RootManageSharedAccessKey
          MT_ASB_KEYVALUE: emulator
        run: |
          # Sending_a_message_to_a_session passes on its own, but its receive endpoint leaves a
          # PingMessage topic subscription that forwards to the session-required
          # input_queue_session. The emulator forwards synchronously and rejects every later
          # PingMessage publish without a SessionId ("Cannot send a message without a SessionId
          # to session-required queue"), which failed StartStop_Specs and
          # Sending_a_request_using_the_request_client_with_raw_json in 2/2 full-suite runs.
          FILTER="FullyQualifiedName!~Sending_a_message_to_a_session"
          FILTER="$FILTER&FullyQualifiedName!~Sending_a_message_with"       # MessageData: requires Azure Blob Storage
          FILTER="$FILTER&FullyQualifiedName!~Sending_a_compressed_message_with_data"  # MessageData: requires Azure Blob Storage
          # NUnit Flaky-marked tests (InMemoryOutboxRedelivery_Specs), except
          # Publishing_an_encrypted_message_to_an_endpoint, which is stable against the emulator.
          FILTER="$FILTER&(TestCategory!=Flaky|FullyQualifiedName~Publishing_an_encrypted_message_to_an_endpoint)"
          # Publishes a ThirdInterface with DeployTopologyOnly and never consumes it. The message
          # auto-forwards into the shared input queue, where Publish_with_complex_hierarchy then
          # counts it (3 instead of 2). Real Service Bus behaves the same; the test isn't isolated.
          FILTER="$FILTER&FullyQualifiedName!~Configuring_a_topology"
          # Hardcodes real Azure endpoint, bypasses MT_ASB_ENDPOINT emulator override.
          FILTER="$FILTER&FullyQualifiedName!~Should_not_fail_when_slash_is_missing"
          # NOTE: Sending_multiple_messages_to_a_session, Turnout, Sending_a_request_from_a_state_machine,
          # Using_a_message_session_as_a_saga_repository, Using_delayed_redelivery_with_dead_letter_queue,
          # Using_the_container_integration and FryFuture used to be excluded as unsupported.
          # They pass against the emulator now (15/16 targeted runs, 3/3 full-suite runs), so they run again.
          dotnet test \
            external/MassTransit/tests/MassTransit.Azure.ServiceBus.Core.Tests \
            --no-build \
            -f net9.0 \
            --filter "$FILTER" \
            --results-directory artifacts/test-results/masstransit \
            --logger "console;verbosity=normal" \
            --logger "trx"

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize_trx.py "MassTransit Conformance" artifacts/test-results/masstransit


      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true

  pack-and-publish:
    name: Pack & Publish
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs:
      - internal-tests
      - client-sdk-smoke
      - wolverine-conformance
      - nservicebus-tests
      - nservicebus-emulator-acceptance
      - masstransit-conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0  # MinVer needs full history to derive version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore AlmostServiceBus.sln

      - name: Pack
        run: |
          dotnet pack src/AlmostServiceBus.Core --configuration Release --no-restore --output ./nupkgs
          dotnet pack src/AlmostServiceBus.TestHost --configuration Release --no-restore --output ./nupkgs
          dotnet pack src/AlmostServiceBus.Aspire.Hosting --configuration Release --no-restore --output ./nupkgs
          dotnet pack src/AlmostServiceBus.Host --configuration Release --no-restore --output ./nupkgs

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
