name: CI

on:
  push:
    branches: [main, develop, "copilot/**"]
  pull_request:

jobs:
  # ── Internal test suite ─────────────────────────────────────────────────────
  # Runs all tests that live inside this repository.  The emulator starts
  # inside each test fixture on random ports, so no separate emulator process
  # is required.  The dev cert MUST be trusted so that the Azure SDK can open
  # AMQPS connections to localhost.
  internal-tests:
    name: Internal Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # Export the ASP.NET Core dev cert and add it to the system CA bundle so
      # that the Azure SDK's AMQPS client accepts it without any client-side
      # validation override.
      - name: Trust HTTPS dev certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https -ep /tmp/devhttps.pfx -p ""
          openssl pkcs12 -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass: 2>/dev/null \
            || openssl pkcs12 -legacy -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass:
          sudo cp /tmp/devhttps.crt /usr/local/share/ca-certificates/aspnetcore-dev.crt
          sudo update-ca-certificates

      - name: Restore & Build
        run: dotnet build AzureServiceBusEmulator.sln

      - name: Test
        run: |
          dotnet test AzureServiceBusEmulator.sln \
            --no-build \
            --filter "FullyQualifiedName!~RealAsbConformanceTests"

  # ── Wolverine conformance ───────────────────────────────────────────────────
  # Wolverine's own Azure Service Bus tests connect to the official emulator
  # API on port 5673 (AMQP) and 5300 (HTTP management) using
  # UseDevelopmentEmulator=true, which disables TLS.  We start
  # AzureServiceBusEmulator on port 5673 so it becomes a drop-in replacement.
  wolverine-conformance:
    name: Wolverine Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout Wolverine submodule
        run: git submodule update --init --depth 1 external/wolverine

      - name: Setup .NET (9 for Wolverine tests, 10 for emulator host)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.x
            10.x

      # The emulator host calls LoadDevCert() at startup, so the cert must
      # exist in the CurrentUser/My store even though Wolverine tests bypass TLS.
      - name: Generate HTTPS dev certificate
        run: dotnet dev-certs https

      - name: Build emulator host
        run: dotnet build src/AzureServiceBusEmulator.Host

      - name: Start emulator on port 5673
        run: |
          # Port 5673: AMQP (matches Wolverine's Servers.AzureServiceBusConnectionString)
          # Port 5300: management HTTP (already bound by default in the host)
          # Port 443:  may fail without root — the host already handles that gracefully
          dotnet run --project src/AzureServiceBusEmulator.Host --no-build \
            -- --Port 5673 --DashboardPort 0 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 30 seconds for the AMQP port to open
          for i in $(seq 1 30); do
            nc -z localhost 5673 2>/dev/null && echo "Emulator ready on port 5673" && break
            sleep 1
          done
          nc -z localhost 5673 || (echo "ERROR: emulator did not start" && exit 1)

      - name: Restore Wolverine Azure Service Bus tests
        run: |
          dotnet restore \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj

      - name: Build Wolverine Azure Service Bus tests
        run: |
          dotnet build \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj \
            --no-restore \
            -f net9.0

      - name: Run Wolverine Azure Service Bus tests
        run: |
          FILTER="FullyQualifiedName!~leader_election"             # Requires PostgreSQL
          FILTER="$FILTER&FullyQualifiedName!~Bug_1684_separated_handlers_and_conventional_routing"  # Flaky test
          FILTER="$FILTER&FullyQualifiedName!~Bug_1933_multi_tenant_conventional_routing"             # Requires second emulator on port 5674
          FILTER="$FILTER&FullyQualifiedName!~Bug_2283_purge_session_subscription"                   # Flaky test
          FILTER="$FILTER&FullyQualifiedName!~StatefulResourceSmokeTests.check_negative"             # Flaky: AutoProvision in helper always creates resources
          # These base-class compliance tests use Wolverine's internal tracking/request-response
          # mechanisms that haven't been fully validated against the emulator yet.
          FILTER="$FILTER&FullyQualifiedName!~TopicAndSubscriptionWithCustomRuleSendingAndReceivingCompliance.tracking_correlation_id_on_everything"
          FILTER="$FILTER&FullyQualifiedName!~TopicAndSubscriptionWithCustomRuleSendingAndReceivingCompliance.requested_response"
          dotnet test \
            external/wolverine/src/Transports/Azure/Wolverine.AzureServiceBus.Tests/Wolverine.AzureServiceBus.Tests.csproj \
            --no-build \
            -f net9.0 \
            --filter "$FILTER"

      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true

  # ── NServiceBus tests ───────────────────────────────────────────────────────
  # The NServiceBus.Transport.AzureServiceBus test suite is primarily unit
  # tests that exercise the transport layer using fakes, so no running emulator
  # is required.
  nservicebus-tests:
    name: NServiceBus Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout NServiceBus submodule
        run: git submodule update --init --depth 1 external/NServiceBus.Transport.AzureServiceBus

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build and test NServiceBus transport
        run: |
          dotnet test \
            external/NServiceBus.Transport.AzureServiceBus/src/Tests \
            --logger "console;verbosity=normal"

  # ── MassTransit conformance ─────────────────────────────────────────────────
  # Runs MassTransit's own Azure Service Bus test suite against the emulator.
  # The submodule is checked out at the upstream commit and a patch is applied
  # to add emulator endpoint support (MT_ASB_ENDPOINT env var) without forking
  # the upstream repo.
  #
  # Known pre-existing failures (emulator limitations, not test infra):
  #   - Sending_a_message_to_a_session  — session-state management link issue
  #   - Publishing_an_encrypted_message_to_an_endpoint — intermittent under load
  masstransit-conformance:
    name: MassTransit Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout MassTransit submodule
        run: git submodule update --init --depth 1 external/MassTransit

      - name: Setup .NET (9 for MT tests, 10 for emulator host)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.x
            10.x

      # Trust the dev cert so the Azure SDK accepts AMQPS connections to localhost.
      - name: Trust HTTPS dev certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https -ep /tmp/devhttps.pfx -p ""
          openssl pkcs12 -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass: 2>/dev/null \
            || openssl pkcs12 -legacy -in /tmp/devhttps.pfx -nokeys -out /tmp/devhttps.crt -passin pass:
          sudo cp /tmp/devhttps.crt /usr/local/share/ca-certificates/aspnetcore-dev.crt
          sudo update-ca-certificates

      # Apply the emulator-compatibility patch to the checked-out submodule.
      # The patch adds MT_ASB_ENDPOINT support so tests can be redirected to
      # localhost instead of *.servicebus.windows.net.
      - name: Apply emulator compatibility patch
        run: |
          git -C external/MassTransit apply \
            ../../patches/MassTransit/0001-emulator-endpoint-support.patch

      - name: Build emulator host
        run: dotnet build src/AzureServiceBusEmulator.Host

      - name: Start emulator on port 5672
        run: |
          dotnet run --project src/AzureServiceBusEmulator.Host --no-build \
            -- --Port 5672 --DashboardPort 0 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            nc -z localhost 5672 2>/dev/null && echo "Emulator ready on port 5672" && break
            sleep 1
          done
          nc -z localhost 5672 || (echo "ERROR: emulator did not start" && exit 1)

      - name: Build MassTransit Azure Service Bus tests
        run: |
          dotnet build \
            external/MassTransit/tests/MassTransit.Azure.ServiceBus.Core.Tests \
            -f net9.0

      - name: Run MassTransit Azure Service Bus tests
        env:
          MT_ASB_ENDPOINT: "sb://localhost:5672"
          MT_ASB_KEYNAME: RootManageSharedAccessKey
          MT_ASB_KEYVALUE: emulator
        run: |
          FILTER="FullyQualifiedName!~Sending_a_message_to_a_session"     # Requires session concurrency support
          FILTER="$FILTER&FullyQualifiedName!~blob_storage"               # Requires Azure Blob Storage
          FILTER="$FILTER&FullyQualifiedName!~Sending_multiple_messages_to_a_session"  # Session concurrency
          FILTER="$FILTER&FullyQualifiedName!~Turnout"                    # Turnout/job service, not implemented
          FILTER="$FILTER&TestCategory!=Flaky"                            # NUnit Flaky-marked tests (known intermittent)
          dotnet test \
            external/MassTransit/tests/MassTransit.Azure.ServiceBus.Core.Tests \
            --no-build \
            -f net9.0 \
            --filter "$FILTER" \
            --logger "console;verbosity=normal"


      - name: Stop emulator
        if: always()
        run: kill "$EMULATOR_PID" 2>/dev/null || true
